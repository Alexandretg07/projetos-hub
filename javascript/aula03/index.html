<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aula 3 – Aplicação web completa</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #f3f4f6; margin: 0; padding: 24px; color: #1f2937; }
    main { max-width: 560px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    h1 { margin-top: 0; font-size: 1.5rem; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 1rem; }
    .linha { display: flex; gap: 8px; }
    button { margin-top: 16px; padding: 10px 16px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font-size: 1rem; cursor: pointer; }
    button.secundario { background: #6b7280; margin-left: 8px; }
    #mensagem { margin-top: 16px; padding: 10px; border-radius: 8px; display: none; }
    #mensagem.erro { display: block; background: #fee2e2; color: #991b1b; }
    #mensagem.sucesso { display: block; background: #dcfce7; color: #166534; }
    ul { list-style: none; padding: 0; margin-top: 20px; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #e5e7eb; }
    .badge { padding: 2px 8px; border-radius: 999px; font-size: .85rem; color: #fff; }
    .Aprovado { background: #16a34a; }
    .Recuperação { background: #d97706; }
    .Reprovado { background: #dc2626; }
    li button { margin: 0; padding: 4px 10px; background: #ef4444; font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <h1>Classificador de alunos</h1>

    <form id="formulario">
      <label for="nome">Nome do aluno</label>
      <input type="text" id="nome" placeholder="Ex.: Maria">

      <div class="linha">
        <div>
          <label for="nota1">Nota 1</label>
          <input type="number" id="nota1" step="0.1" min="0" max="10">
        </div>
        <div>
          <label for="nota2">Nota 2</label>
          <input type="number" id="nota2" step="0.1" min="0" max="10">
        </div>
        <div>
          <label for="nota3">Nota 3</label>
          <input type="number" id="nota3" step="0.1" min="0" max="10">
        </div>
      </div>

      <button type="submit">Classificar</button>
      <button type="button" id="limpar" class="secundario">Limpar lista</button>
    </form>

    <div id="mensagem" role="alert"></div>
    <p id="contador">Nenhum aluno cadastrado.</p>
    <ul id="lista"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
