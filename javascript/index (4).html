<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aula 3 – Aplicação web completa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Classificador de alunos</h1>

    <form id="formulario">
      <label for="nome">Nome do aluno</label>
      <input type="text" id="nome" placeholder="Ex.: Maria">

      <div class="linha">
        <div>
          <label for="nota1">Nota 1</label>
          <input type="number" id="nota1" step="0.1" min="0" max="10">
        </div>
        <div>
          <label for="nota2">Nota 2</label>
          <input type="number" id="nota2" step="0.1" min="0" max="10">
        </div>
        <div>
          <label for="nota3">Nota 3</label>
          <input type="number" id="nota3" step="0.1" min="0" max="10">
        </div>
      </div>

      <button type="submit">Classificar</button>
      <button type="button" id="limpar" class="secundario">Limpar lista</button>
    </form>

    <div id="mensagem" role="alert"></div>
    <p id="contador">Nenhum aluno cadastrado.</p>
    <ul id="lista"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
